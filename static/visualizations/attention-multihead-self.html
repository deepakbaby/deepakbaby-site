<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi-head self-attention, one head at a time</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Source+Sans+3:wght@400;600&family=STIX+Two+Text:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0e1018;
      --text: #f5f5f5;
      --muted: #aeb5c0;
      --line: rgba(255,255,255,.13);
      --line-strong: rgba(255,255,255,.28);
      --q: #58c4dd;
      --k: #ffff00;
      --v: #9a72ac;
      --prob: #83c167;
      --score: #d147bd;
    }
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
    }
    body { font-family: "Source Sans 3", sans-serif; }
    button { font: inherit; }
    .app {
      width: 100%;
      height: 100%;
      padding: 12px 14px;
      display: grid;
      grid-template-rows: auto auto auto minmax(0, 1fr) auto;
      gap: 7px;
    }
    header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
    }
    h1 {
      margin: 0;
      font: 600 clamp(17px, 2.2vw, 27px)/1.08 "STIX Two Text", serif;
      letter-spacing: -.02em;
    }
    .subtitle {
      max-width: 760px;
      margin-top: 3px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.35;
    }
    .legend {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 9px;
      color: var(--muted);
      font: 500 11px/1.2 "IBM Plex Mono", monospace;
    }
    .legend span { display: inline-flex; align-items: center; gap: 4px; }
    .legend i { width: 7px; height: 7px; background: var(--c); border-radius: 50%; }
    .legend .q { --c: var(--q); }
    .legend .k { --c: var(--k); }
    .legend .score { --c: var(--score); }
    .legend .prob { --c: var(--prob); }
    .legend .v { --c: var(--v); }
    .steps {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      border-bottom: 1px solid var(--line);
    }
    .step {
      position: relative;
      min-width: 0;
      padding: 6px 7px;
      border: 0;
      background: transparent;
      color: #748194;
      cursor: pointer;
      text-align: left;
      font: 500 11px/1.2 "IBM Plex Mono", monospace;
    }
    .step:hover, .step:focus-visible { color: #d9e2ec; background: rgba(255,255,255,.025); }
    .step.active { color: var(--text); }
    .step.active::after {
      content: "";
      position: absolute;
      left: 7px;
      right: 7px;
      bottom: -1px;
      height: 2px;
      background: var(--q);
    }
    .explain {
      min-height: 78px;
      padding: 8px 11px;
      display: grid;
      grid-template-columns: minmax(145px,.65fr) minmax(240px,1.4fr) minmax(180px,.8fr);
      grid-template-rows: auto auto;
      column-gap: 18px;
      align-items: center;
      border-bottom: 1px solid var(--line);
    }
    .eyebrow {
      grid-column: 1;
      color: var(--q);
      font: 600 11px/1.2 "IBM Plex Mono", monospace;
    }
    h2 {
      grid-column: 1;
      margin: 2px 0 0;
      font: 600 clamp(16px,1.6vw,22px)/1.08 "STIX Two Text", serif;
      letter-spacing: -.02em;
    }
    .copy {
      grid-column: 2;
      grid-row: 1 / span 2;
      margin: 0;
      color: #d1d4d9;
      font-size: 13px;
      line-height: 1.4;
    }
    .equation {
      grid-column: 3;
      grid-row: 1;
      padding-bottom: 4px;
      border-bottom: 1px solid var(--line);
      font: 600 15px/1.25 "STIX Two Text", serif;
    }
    .detail {
      grid-column: 3;
      grid-row: 2;
      color: #8793a3;
      font: 400 11px/1.35 "IBM Plex Mono", monospace;
    }
    .stage { min-height: 0; overflow: hidden; }
    svg { display: block; width: 100%; height: 100%; }
    .arc {
      fill: none;
      stroke: var(--score);
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }
    .token-box { fill: #131823; stroke: var(--line-strong); vector-effect: non-scaling-stroke; }
    .token-box.query { stroke: var(--q); stroke-width: 2; }
    .token-box.key { stroke: var(--k); }
    .token-label, .svg-label {
      fill: #e9edf2;
      font-family: "IBM Plex Mono", monospace;
      text-anchor: middle;
    }
    .token-label { font-size: 15px; }
    .svg-label { font-size: 14px; fill: #aeb8c5; }
    .prob { fill: var(--prob); }
    .value { fill: var(--v); }
    .controls { display: flex; align-items: center; gap: 6px; }
    .control {
      min-width: 58px;
      padding: 6px 9px;
      border: 1px solid var(--line-strong);
      border-radius: 2px;
      background: rgba(255,255,255,.035);
      color: #dce4ed;
      cursor: pointer;
      font: 600 11px/1 "IBM Plex Mono", monospace;
    }
    .control:hover, .control:focus-visible { border-color: rgba(88,196,221,.65); }
    .control.primary { color: #071117; background: var(--q); border-color: var(--q); }
    .progress { flex: 1; height: 2px; margin-left: 3px; background: rgba(255,255,255,.08); }
    .progress span { display: block; width: 20%; height: 100%; background: var(--q); transition: width .25s ease; }

    @media (max-width: 650px) {
      .app { padding: 7px; gap: 4px; }
      h1 { font-size: 15px; }
      .subtitle, .legend { display: none; }
      .step { padding: 5px 2px; font-size: 8px; text-align: center; white-space: nowrap; }
      .explain {
        min-height: 88px;
        padding: 6px 7px;
        grid-template-columns: minmax(90px,.7fr) minmax(170px,1.3fr);
        column-gap: 8px;
      }
      .eyebrow { font-size: 8px; }
      h2 { font-size: 13px; }
      .copy { font-size: 10px; line-height: 1.28; }
      .equation, .detail { display: none; }
      .control { min-width: 0; padding: 5px 7px; font-size: 9px; }
    }
    @media (max-height: 430px) {
      .subtitle { display: none; }
      .explain { min-height: 60px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div>
        <h1>Multi-head self-attention, one head at a time</h1>
        <div class="subtitle">Four possible attention patterns over the same sentence, followed by the learned combination. These are illustrative archetypes—not roles assigned to specific heads.</div>
      </div>
      <div class="legend" role="group" aria-label="Color legend">
        <span><i class="q"></i>query</span>
        <span><i class="k"></i>key</span>
        <span><i class="score"></i>score</span>
        <span><i class="prob"></i>probability</span>
        <span><i class="v"></i>value</span>
      </div>
    </header>

    <nav class="steps" id="steps" aria-label="Multi-head attention steps"></nav>

    <section class="explain" aria-live="polite">
      <div class="eyebrow" id="eyebrow"></div>
      <h2 id="stepTitle">Nearby context</h2>
      <p class="copy" id="copy"></p>
      <div class="equation" id="equation"></div>
      <div class="detail" id="detail"></div>
    </section>

    <section class="stage">
      <svg id="scene" viewBox="0 0 1000 500" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="svgTitle svgDesc">
        <title id="svgTitle">Guided multi-head self-attention visualization</title>
        <desc id="svgDesc">Attention arcs over the sentence The animal did not cross the street because it was tired.</desc>
      </svg>
    </section>

    <div class="controls">
      <button class="control" id="prev" type="button">Previous</button>
      <button class="control primary" id="play" type="button">Play</button>
      <button class="control" id="next" type="button">Next</button>
      <div class="progress" aria-hidden="true"><span id="progress"></span></div>
    </div>
  </main>

  <script>
  (() => {
    "use strict";
    const NS = "http://www.w3.org/2000/svg";
    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const tokens = ["The", "animal", "didn't", "cross", "the", "street", "because", "it", "was", "tired"];
    const patterns = [
      {
        short: "Head 1",
        eyebrow: "1 / 5 · local pattern",
        title: "Nearby context",
        copy: "One learned head might emphasize adjacent tokens, giving each query a compact local context. The highlighted token is the query; yellow outlines mark keys it reads.",
        equation: "head₁ = softmax(Q₁K₁ᵀ / √dₕ)V₁",
        detail: "Illustrative pattern · no head is assigned this role",
        query: 5,
        edges: [[5,4,.72],[5,6,.24],[5,3,.12]]
      },
      {
        short: "Head 2",
        eyebrow: "2 / 5 · syntactic-looking pattern",
        title: "Longer grammatical links",
        copy: "A different projection can make a query favor tokens that look structurally related, even when they are not adjacent.",
        equation: "head₂ = softmax(Q₂K₂ᵀ / √dₕ)V₂",
        detail: "Illustrative pattern · learned from data, not prescribed",
        query: 3,
        edges: [[3,1,.82],[3,5,.48],[3,2,.31]]
      },
      {
        short: "Head 3",
        eyebrow: "3 / 5 · reference-looking pattern",
        title: "Distant reference",
        copy: "Another head may place most probability on a distant token. Here “it” reads strongly from “animal” as one possible interpretation.",
        equation: "head₃ = softmax(Q₃K₃ᵀ / √dₕ)V₃",
        detail: "Illustrative pattern · not a guaranteed head function",
        query: 7,
        edges: [[7,1,.91],[7,5,.18],[7,9,.11]]
      },
      {
        short: "Head 4",
        eyebrow: "4 / 5 · broad pattern",
        title: "Distributed context",
        copy: "A head can also spread probability across several keys, mixing information from multiple parts of the sentence instead of choosing one link.",
        equation: "head₄ = softmax(Q₄K₄ᵀ / √dₕ)V₄",
        detail: "Illustrative pattern · real heads can be mixed or diffuse",
        query: 9,
        edges: [[9,1,.25],[9,3,.24],[9,5,.22],[9,7,.20]]
      },
      {
        short: "Combine",
        eyebrow: "5 / 5 · combine learned views",
        title: "Concatenate, then project",
        copy: "All heads run in parallel. Their narrower outputs are concatenated and mixed by Wᴼ. With fixed d_model, more heads mean smaller heads: too few may limit distinct views; too many can make each view too narrow.",
        equation: "MultiHead = Concat(head₁…headₕ)Wᴼ",
        detail: "d_head = d_model / h · balance breadth against capacity",
        combine: true
      }
    ];

    const scene = document.getElementById("scene");
    const stepsEl = document.getElementById("steps");
    const playBtn = document.getElementById("play");
    const progress = document.getElementById("progress");
    let index = 0;
    let playing = false;
    let runId = 0;

    function el(name, attrs = {}, text = "") {
      const node = document.createElementNS(NS, name);
      Object.entries(attrs).forEach(([key, value]) => node.setAttribute(key, value));
      if (text) node.textContent = text;
      return node;
    }

    function tokenX(i) { return 65 + i * (870 / (tokens.length - 1)); }

    function addTokens(step) {
      const y = 405;
      tokens.forEach((token, i) => {
        const group = el("g");
        const width = Math.max(58, token.length * 10 + 20);
        const cls = i === step.query ? "token-box query" : step.edges.some(edge => edge[1] === i) ? "token-box key" : "token-box";
        group.appendChild(el("rect", { x: tokenX(i) - width / 2, y: y - 18, width, height: 36, rx: 2, class: cls }));
        group.appendChild(el("text", { x: tokenX(i), y: y + 5, class: "token-label" }, token));
        scene.appendChild(group);
      });
      scene.appendChild(el("text", { x: tokenX(step.query), y: 455, class: "svg-label", fill: "#58c4dd" }, "QUERY"));
    }

    function arcPath(from, to, lift) {
      const x1 = tokenX(from), x2 = tokenX(to), y = 385;
      return `M ${x1} ${y} Q ${(x1 + x2) / 2} ${y - lift} ${x2} ${y}`;
    }

    function renderPattern(step, animate) {
      addTokens(step);
      const paths = [];
      step.edges.forEach((edge, i) => {
        const distance = Math.abs(edge[0] - edge[1]);
        const path = el("path", {
          d: arcPath(edge[0], edge[1], 70 + distance * 26 + i * 10),
          class: "arc",
          "stroke-width": 1.4 + edge[2] * 4,
          opacity: .28 + edge[2] * .7
        });
        scene.insertBefore(path, scene.firstChild);
        const length = path.getTotalLength();
        if (animate && !reduceMotion) {
          path.style.strokeDasharray = length;
          path.style.strokeDashoffset = length;
          path.animate(
            [{ strokeDashoffset: length }, { strokeDashoffset: 0 }],
            { duration: 650, delay: i * 150, fill: "forwards", easing: "ease-out" }
          );
        }
        paths.push(path);

        const cx = tokenX(edge[1]);
        const radius = 5 + edge[2] * 9;
        const probability = el("circle", { cx, cy: 355, r: radius, class: "prob", opacity: .35 + edge[2] * .65 });
        scene.appendChild(probability);
        if (animate && !reduceMotion) {
          probability.style.transformOrigin = `${cx}px 355px`;
          probability.animate(
            [{ transform: "scale(0)" }, { transform: "scale(1)" }],
            { duration: 280, delay: 500 + i * 150, fill: "forwards", easing: "ease-out" }
          );
        }
      });
      scene.appendChild(el("text", { x: 500, y: 45, class: "svg-label" }, "one query distributes probability across keys"));
      return reduceMotion || !animate ? 0 : 650 + (paths.length - 1) * 150 + 280;
    }

    function renderCombine(animate) {
      const labels = ["head₁", "head₂", "head₃", "head₄"];
      const group = el("g");
      labels.forEach((label, i) => {
        const x = 80 + i * 165;
        group.appendChild(el("text", { x: x + 55, y: 116, class: "svg-label" }, label));
        for (let j = 0; j < 4; j++) {
          group.appendChild(el("rect", {
            x: x + j * 27, y: 140, width: 21, height: 94,
            fill: i % 2 ? "#58c4dd" : "#9a72ac",
            opacity: .34 + j * .12
          }));
        }
      });
      group.appendChild(el("text", { x: 744, y: 188, class: "svg-label" }, "Concat"));
      group.appendChild(el("path", { d: "M 716 187 L 790 187", stroke: "#83c167", "stroke-width": 2 }));
      group.appendChild(el("rect", { x: 805, y: 139, width: 72, height: 96, fill: "none", stroke: "#d147bd", "stroke-width": 2 }));
      group.appendChild(el("text", { x: 841, y: 183, class: "token-label" }, "Wᴼ"));
      group.appendChild(el("text", { x: 841, y: 201, class: "svg-label" }, "mix"));
      group.appendChild(el("path", { d: "M 877 187 L 935 187", stroke: "#83c167", "stroke-width": 2 }));
      group.appendChild(el("text", { x: 956, y: 191, class: "svg-label" }, "Y"));
      group.appendChild(el("line", { x1: 70, y1: 285, x2: 930, y2: 285, stroke: "rgba(255,255,255,.13)" }));
      group.appendChild(el("text", { x: 290, y: 340, class: "token-label" }, "d_head = d_model / h"));
      group.appendChild(el("text", { x: 290, y: 370, class: "svg-label" }, "too few heads → fewer distinct views"));
      group.appendChild(el("text", { x: 710, y: 370, class: "svg-label" }, "too many heads → each view may be too narrow"));
      scene.appendChild(group);
      if (animate && !reduceMotion) {
        group.animate([{ opacity: 0, transform: "translateY(8px)" }, { opacity: 1, transform: "translateY(0)" }],
          { duration: 650, fill: "forwards", easing: "ease-out" });
      }
      return reduceMotion || !animate ? 0 : 650;
    }

    function renderStep(next, animate = true) {
      index = Math.max(0, Math.min(patterns.length - 1, next));
      const step = patterns[index];
      scene.querySelectorAll(":not(title):not(desc)").forEach(node => node.remove());
      document.getElementById("eyebrow").textContent = step.eyebrow;
      document.getElementById("stepTitle").textContent = step.title;
      document.getElementById("copy").textContent = step.copy;
      document.getElementById("equation").textContent = step.equation;
      document.getElementById("detail").textContent = step.detail;
      [...stepsEl.children].forEach((button, i) => {
        button.classList.toggle("active", i === index);
        if (i === index) button.setAttribute("aria-current", "step");
        else button.removeAttribute("aria-current");
      });
      progress.style.width = `${((index + 1) / patterns.length) * 100}%`;
      return step.combine ? renderCombine(animate) : renderPattern(step, animate);
    }

    patterns.forEach((step, i) => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "step";
      button.textContent = `${i + 1}. ${step.short}`;
      button.addEventListener("click", () => {
        stop();
        renderStep(i);
      });
      stepsEl.appendChild(button);
    });

    function wait(ms, id) {
      return new Promise(resolve => {
        window.setTimeout(() => resolve(id === runId), ms);
      });
    }

    async function play() {
      if (playing) { stop(); return; }
      playing = true;
      const id = ++runId;
      playBtn.textContent = "Pause";
      if (index === patterns.length - 1) index = 0;
      while (playing && id === runId) {
        const animationTime = renderStep(index, true);
        if (!await wait(animationTime + 900, id) || !playing) break;
        if (index === patterns.length - 1) {
          stop();
          break;
        }
        index += 1;
      }
    }

    function stop() {
      playing = false;
      runId += 1;
      playBtn.textContent = "Play";
    }

    playBtn.addEventListener("click", play);
    document.getElementById("prev").addEventListener("click", () => { stop(); renderStep(index - 1); });
    document.getElementById("next").addEventListener("click", () => { stop(); renderStep(index + 1); });
    document.addEventListener("keydown", event => {
      if (event.key === "ArrowLeft") { stop(); renderStep(index - 1); }
      if (event.key === "ArrowRight") { stop(); renderStep(index + 1); }
      if (event.key === " " && event.target === document.body) { event.preventDefault(); play(); }
    });

    renderStep(0, false);
  })();
  </script>
</body>
</html>
