<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bahdanau Attention Alignment</title>
  <style>
    :root {
      --text: #0f172a;
      --muted: #475569;
      --panel-bg: rgba(15, 23, 42, 0.04);
      --panel-border: rgba(15, 23, 42, 0.12);
      --cell-bg: rgba(15, 23, 42, 0.06);
      --cell-border: rgba(15, 23, 42, 0.08);
      --active-bg: rgba(37, 99, 235, 0.12);
      --active-border: rgba(37, 99, 235, 0.5);
      --hot: #d97706;
      --focus: #b45309;
      --dot: #2563eb;
    }
    html[data-theme="dark"] {
      --text: #f8fafc;
      --muted: #94a3b8;
      --panel-bg: rgba(255, 255, 255, 0.04);
      --panel-border: rgba(255, 255, 255, 0.12);
      --cell-bg: rgba(255, 255, 255, 0.04);
      --cell-border: rgba(255, 255, 255, 0.08);
      --active-bg: rgba(245, 158, 11, 0.18);
      --active-border: rgba(245, 158, 11, 0.55);
      --hot: #f59e0b;
      --focus: #fbbf24;
      --dot: #3b82f6;
    }
    @media (prefers-color-scheme: dark) {
      html:not([data-theme]) {
        --text: #f8fafc;
        --muted: #94a3b8;
        --panel-bg: rgba(255, 255, 255, 0.04);
        --panel-border: rgba(255, 255, 255, 0.12);
        --cell-bg: rgba(255, 255, 255, 0.04);
        --cell-border: rgba(255, 255, 255, 0.08);
        --active-bg: rgba(245, 158, 11, 0.18);
        --active-border: rgba(245, 158, 11, 0.55);
        --hot: #f59e0b;
        --focus: #fbbf24;
        --dot: #3b82f6;
      }
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body {
      padding: 14px 16px 18px;
      min-height: 100vh;
    }
    .wrap {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }
    button {
      padding: 7px 14px;
      border-radius: 999px;
      border: 1px solid var(--panel-border);
      background: var(--panel-bg);
      color: var(--text);
      cursor: pointer;
      font-weight: 700;
      font-size: 12.5px;
      transition: background 160ms ease;
    }
    button:hover { background: var(--active-bg); }
    .progress {
      margin-left: auto;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    /* Combined input + output card */
    .io-card {
      border: 1px solid var(--panel-border);
      background: var(--panel-bg);
      border-radius: 12px;
      padding: 6px 14px;
      display: grid;
      gap: 2px;
    }
    .io-row {
      display: flex;
      align-items: baseline;
      gap: 6px;
      flex-wrap: wrap;
      min-height: 44px;
      padding: 6px 0;
    }
    .io-row + .io-row {
      border-top: 1px dashed var(--panel-border);
    }
    .target-label {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-right: 6px;
      min-width: 56px;
    }
    .src-word {
      font-size: 17px;
      font-weight: 600;
      color: var(--text);
    }
    .target-word {
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
      opacity: 0;
      transform: translateY(4px);
      transition: opacity 350ms ease, transform 350ms ease, color 250ms ease;
    }
    .target-word.shown {
      opacity: 1;
      transform: translateY(0);
    }
    .target-word.current {
      color: var(--hot);
    }
    .caret {
      display: inline-block;
      width: 8px;
      height: 22px;
      background: var(--hot);
      vertical-align: middle;
      animation: blink 1s infinite;
      border-radius: 2px;
      transform: translateY(2px);
    }
    @keyframes blink {
      0%, 60% { opacity: 1; }
      61%, 100% { opacity: 0; }
    }

    /* Heatmap card */
    .matrix-card {
      border: 1px solid var(--panel-border);
      background: var(--panel-bg);
      border-radius: 14px;
      padding: 14px;
      display: grid;
      grid-template-columns: 100px 1fr;
      grid-template-rows: 56px 1fr;
      gap: 8px;
    }
    .corner {
      display: grid;
      place-items: end start;
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 700;
    }
    .x-labels {
      display: grid;
      grid-template-columns: repeat(9, minmax(0, 1fr));
      gap: 6px;
      align-items: end;
    }
    .x-label {
      color: var(--muted);
      font-size: 11px;
      line-height: 1.1;
      text-align: center;
      transform: rotate(-22deg);
      transform-origin: bottom center;
    }
    .y-labels {
      display: grid;
      grid-template-rows: repeat(7, minmax(0, 1fr));
      gap: 6px;
    }
    .y-label {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 10px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.1;
      border-radius: 8px;
      transition: background 200ms ease, color 200ms ease;
    }
    .y-label.active {
      color: var(--text);
      background: var(--active-bg);
    }
    .heatmap {
      display: grid;
      grid-template-columns: repeat(9, minmax(0, 1fr));
      grid-template-rows: repeat(7, minmax(0, 1fr));
      gap: 6px;
      min-height: 280px;
    }
    .cell {
      position: relative;
      border-radius: 8px;
      border: 1px solid var(--cell-border);
      background: var(--cell-bg);
      overflow: hidden;
      transition: transform 240ms ease, border-color 240ms ease, opacity 240ms ease;
    }
    .cell::before {
      content: "";
      position: absolute;
      inset: 0;
      background: var(--hot);
      opacity: calc(var(--alpha) * var(--visible));
      transition: opacity 280ms ease;
    }
    .cell.focus {
      transform: scale(1.05);
      border-color: var(--focus);
      z-index: 2;
    }

    .legend {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-size: 12px;
      flex-wrap: wrap;
    }
    .swatches {
      display: inline-flex;
      gap: 7px;
      align-items: center;
    }
    .swatch {
      width: 60px;
      height: 10px;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--cell-bg), var(--hot));
      border: 1px solid var(--panel-border);
    }

    @media (max-width: 720px) {
      .matrix-card {
        grid-template-columns: 80px 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="controls">
      <button id="play">Play</button>
      <button id="step">Step</button>
      <button id="reset">Reset</button>
      <span class="progress" id="progress">1 / 7</span>
    </div>

    <div class="io-card">
      <div class="io-row">
        <span class="target-label">input</span>
        <span id="sourceWords"></span>
      </div>
      <div class="io-row">
        <span class="target-label">output</span>
        <span id="targetWords"></span>
        <span class="caret" id="caret"></span>
      </div>
    </div>

    <div class="matrix-card">
      <div class="corner">source tokens</div>
      <div class="x-labels" id="sourceLabels"></div>
      <div class="y-labels" id="targetLabels"></div>
      <div class="heatmap" id="heatmap"></div>
    </div>

    <div class="legend">
      <span>Rows are output tokens, columns are source tokens. Brighter cells = larger attention weight. A new row appears each time the decoder emits a word.</span>
      <span class="swatches"><span>low</span><span class="swatch"></span><span>high</span></span>
    </div>
  </div>

  <script>
    (function syncTheme() {
      function apply(theme) {
        if (theme) document.documentElement.setAttribute("data-theme", theme);
        else document.documentElement.removeAttribute("data-theme");
      }
      function readParent() {
        try { return window.parent.document.documentElement.getAttribute("data-theme"); }
        catch (e) { return null; }
      }
      apply(readParent());
      try {
        const obs = new MutationObserver(() => apply(readParent()));
        obs.observe(window.parent.document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
      } catch (e) {}
    })();

    const source = ["the", "agreement", "on", "European", "Economic", "Area", "signed", "August", "1992"];
    const target = ["l'accord", "sur", "l'Espace", "économique", "européen", "signé", "1992"];
    const weights = [
      [0.08, 0.62, 0.08, 0.04, 0.04, 0.03, 0.07, 0.02, 0.02],
      [0.05, 0.10, 0.58, 0.08, 0.06, 0.04, 0.04, 0.03, 0.02],
      [0.02, 0.05, 0.05, 0.31, 0.18, 0.30, 0.03, 0.03, 0.03],
      [0.02, 0.04, 0.03, 0.17, 0.56, 0.12, 0.02, 0.02, 0.02],
      [0.02, 0.03, 0.02, 0.58, 0.17, 0.13, 0.02, 0.01, 0.02],
      [0.04, 0.12, 0.03, 0.03, 0.03, 0.04, 0.61, 0.06, 0.04],
      [0.02, 0.02, 0.02, 0.02, 0.02, 0.02, 0.06, 0.24, 0.58],
    ];

    let step = 0;
    let timer = null;

    const sourceLabels = document.getElementById("sourceLabels");
    const targetLabels = document.getElementById("targetLabels");
    const heatmap = document.getElementById("heatmap");
    const targetWordsEl = document.getElementById("targetWords");
    const progressEl = document.getElementById("progress");
    const playButton = document.getElementById("play");

    sourceLabels.innerHTML = source.map(token => `<div class="x-label">${token}</div>`).join("");
    targetLabels.innerHTML = target.map((token, i) => `<div class="y-label" data-row="${i}">${token}</div>`).join("");
    targetWordsEl.innerHTML = target.map((t, i) => `<span class="target-word" data-i="${i}">${t}</span>`).join(" ");
    document.getElementById("sourceWords").innerHTML = source.map(t => `<span class="src-word">${t}</span>`).join(" ");

    function render() {
      heatmap.innerHTML = "";
      weights.forEach((row, rowIndex) => {
        row.forEach((value, colIndex) => {
          const visible = rowIndex <= step ? 1 : 0;
          const isFocus = rowIndex === step && value === Math.max(...row);
          const cell = document.createElement("div");
          cell.className = `cell${isFocus ? " focus" : ""}`;
          cell.style.setProperty("--alpha", String(Math.min(0.95, value * 1.45)));
          cell.style.setProperty("--visible", String(visible));
          cell.title = `${target[rowIndex]} → ${source[colIndex]}: ${value.toFixed(2)}`;
          heatmap.appendChild(cell);
        });
      });

      document.querySelectorAll(".y-label").forEach((label, index) => {
        label.classList.toggle("active", index === step);
      });

      document.querySelectorAll(".target-word").forEach((w, i) => {
        w.classList.toggle("shown", i <= step);
        w.classList.toggle("current", i === step);
      });

      progressEl.textContent = `${step + 1} / ${target.length}`;
    }

    function advance() {
      step = (step + 1) % target.length;
      render();
    }

    document.getElementById("step").addEventListener("click", advance);
    document.getElementById("reset").addEventListener("click", () => { step = 0; render(); });
    playButton.addEventListener("click", () => {
      if (timer) {
        clearInterval(timer);
        timer = null;
        playButton.textContent = "Play";
        return;
      }
      timer = setInterval(advance, 1200);
      playButton.textContent = "Pause";
    });

    render();
  </script>
</body>
</html>
